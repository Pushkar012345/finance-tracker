server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that isn't a real file goes to index.html
    # so React Router handles client-side routes on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed static assets; index.html itself stays uncached
    # so deploys are picked up immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# If you push again while a run is still going on the same branch, cancel
# the older run instead of wasting minutes on a commit that is already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only needs to read the code; least privilege for the auto-generated token.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://finance:finance@localhost:5432/finance_tracker_test
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # Caches ~/.npm keyed on the lockfile, so unchanged dependencies
          # aren't re-downloaded on every run.
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # `npm ci` installs exactly what package-lock.json says (and fails if
      # it's out of sync with package.json); `npm install` can silently drift.
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx prisma migrate deploy
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build # runs `tsc -b` first, then the Vite build

  # Builds the real Docker images and boots the whole stack the same way
  # `docker compose up` does locally, then hits the health endpoints. This
  # catches things the jobs above can't: a broken Dockerfile, a missing file
  # in the image, migrations failing inside the container, or the API
  # starting but not being able to reach Postgres.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images and start the stack
        # --wait blocks until every service with a healthcheck is healthy
        # (or fails after the timeout), so no manual sleep/retry loop.
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Smoke test - API liveness
        run: curl --fail --silent --show-error http://localhost:4000/health

      - name: Smoke test - API readiness (database reachable)
        run: curl --fail --silent --show-error http://localhost:4000/health/ready

      - name: Smoke test - frontend serves the app
        run: curl --fail --silent --show-error --head http://localhost:5173/

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  # Backend -> AWS. Builds backend/Dockerfile, pushes it to ECR (tagged with
  # the commit SHA and `latest`), then forces ECS to pull the new image.
  # Uses a deploy-only IAM user (ECR push + ECS update on one service) whose
  # keys live in GitHub secrets. Runs only on a push to main, after tests pass.
  deploy-backend-aws:
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-southeast-2
      ECR_REPO: finance-tracker-backend
      ECS_CLUSTER: default
      ECS_SERVICE: finance-tracker-backend-bea9
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/$ECR_REPO"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" backend
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Redeploy ECS service
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --force-new-deployment --query 'service.serviceName' --output text

      - name: Wait for the deployment to become stable
        run: aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

  # Frontend -> AWS. Builds the Vite app with the AWS backend URL baked in
  # (Vite reads VITE_API_URL at build time), syncs dist/ to the private S3
  # bucket, then invalidates CloudFront so users get the new files at once.
  deploy-frontend-aws:
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-southeast-2
      S3_BUCKET: finance-tracker-fe-961394077583
      CLOUDFRONT_DISTRIBUTION_ID: E1APMSXKHS33L9
      VITE_API_URL: https://fi-9909d8242a7945519286a7cdd2428b98.ecs.ap-southeast-2.on.aws/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: aws s3 sync frontend/dist "s3://$S3_BUCKET" --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
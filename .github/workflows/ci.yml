name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# If you push again while a run is still going on the same branch, cancel
# the older run instead of wasting minutes on a commit that is already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only needs to read the code; least privilege for the auto-generated token.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://finance:finance@localhost:5432/finance_tracker_test
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # Caches ~/.npm keyed on the lockfile, so unchanged dependencies
          # aren't re-downloaded on every run.
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # `npm ci` installs exactly what package-lock.json says (and fails if
      # it's out of sync with package.json); `npm install` can silently drift.
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx prisma migrate deploy
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build # runs `tsc -b` first, then the Vite build

  # Builds the real Docker images and boots the whole stack the same way
  # `docker compose up` does locally, then hits the health endpoints. This
  # catches things the jobs above can't: a broken Dockerfile, a missing file
  # in the image, migrations failing inside the container, or the API
  # starting but not being able to reach Postgres.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images and start the stack
        # --wait blocks until every service with a healthcheck is healthy
        # (or fails after the timeout), so no manual sleep/retry loop.
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Smoke test - API liveness
        run: curl --fail --silent --show-error http://localhost:4000/health

      - name: Smoke test - API readiness (database reachable)
        run: curl --fail --silent --show-error http://localhost:4000/health/ready

      - name: Smoke test - frontend serves the app
        run: curl --fail --silent --show-error --head http://localhost:5173/

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  # Fires the two providers' deploy hooks once both test/build jobs pass on
  # main. Deploy hooks are plain "POST this URL to trigger a deploy" links
  # generated in the Render/Vercel dashboards — no CLI or API token needed,
  # each provider then pulls the latest `main` and builds it themselves
  # (Render uses backend/Dockerfile, Vercel uses frontend/vercel.json).
  # Doesn't run on pull_request, only on a push that lands on main.
  deploy:
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend (Render)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl --fail -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Skip backend deploy (no hook configured)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        if: ${{ env.RENDER_DEPLOY_HOOK_URL == '' }}
        run: echo "RENDER_DEPLOY_HOOK_URL secret not set — skipping backend deploy. See README > Deploying."

      - name: Deploy frontend (Vercel)
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        if: ${{ env.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: curl --fail -X POST "$VERCEL_DEPLOY_HOOK_URL"

      - name: Skip frontend deploy (no hook configured)
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        if: ${{ env.VERCEL_DEPLOY_HOOK_URL == '' }}
        run: echo "VERCEL_DEPLOY_HOOK_URL secret not set — skipping frontend deploy. See README > Deploying."